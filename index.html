<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Valorant Clone Prototype</title>
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app"></div>

<!-- HUD: everything here is non-interactive (pointer-events:none). Owned by js/ui.js -->
<div id="hud">
  <div id="damage-vignette" class="hud-vignette"></div>

  <div id="fps" class="hud-fps">0 FPS</div>

  <div class="hud-top">
    <div class="hud-score hud-score-ally">
      <span class="hud-score-label">YOU</span>
      <span id="score-kills" class="hud-score-value">0</span>
    </div>
    <div class="hud-timer-box">
      <div id="round-timer" class="hud-timer">1:40</div>
      <div class="hud-timer-sub">ROUND</div>
    </div>
    <div class="hud-score hud-score-enemy">
      <span id="score-deaths" class="hud-score-value">0</span>
      <span class="hud-score-label">BOTS</span>
    </div>
  </div>

  <div id="killfeed" class="hud-killfeed"></div>

  <div id="hitmarker" class="hud-hitmarker"><i></i><i></i><i></i><i></i></div>

  <div id="reloading" class="hud-reloading">
    <span class="hud-reloading-text">RELOADING</span>
    <span class="hud-reloading-bar"><span></span></span>
  </div>

  <div id="message" class="hud-message"></div>

  <div class="hud-bottom-left">
    <div class="hud-stat hud-health">
      <span class="hud-stat-icon hud-icon-health" aria-hidden="true"></span>
      <div class="hud-bar"><div id="health-bar" class="hud-bar-fill"></div></div>
      <span id="health-value" class="hud-stat-value">100</span>
    </div>
    <div class="hud-stat hud-armor">
      <span class="hud-stat-icon hud-icon-armor" aria-hidden="true"></span>
      <div class="hud-bar"><div id="armor-bar" class="hud-bar-fill"></div></div>
      <span id="armor-value" class="hud-stat-value">0</span>
    </div>
  </div>

  <div class="hud-bottom-right">
    <div id="weapon-name" class="hud-weapon-name">VANDAL</div>
    <div class="hud-ammo">
      <span id="ammo-mag" class="hud-ammo-mag">25</span>
      <span class="hud-ammo-sep">/</span>
      <span id="ammo-reserve" class="hud-ammo-reserve">75</span>
    </div>
  </div>
</div>

<!-- Start / pause screen. main.js attaches the click handler that requests pointer lock. -->
<div id="overlay">
  <div class="overlay-panel">
    <div class="overlay-eyebrow">PROTOTYPE // THREE.JS</div>
    <h1 id="overlay-title" class="overlay-title">VALORANT CLONE</h1>
    <p id="overlay-subtitle" class="overlay-subtitle">Click to play</p>
    <ul class="overlay-controls">
      <li><kbd>W A S D</kbd><span>Move</span></li>
      <li><kbd>Shift</kbd><span>Walk</span></li>
      <li><kbd>Ctrl</kbd><span>Crouch</span></li>
      <li><kbd>Space</kbd><span>Jump</span></li>
      <li><kbd>LMB</kbd><span>Shoot</span></li>
      <li><kbd>R</kbd><span>Reload</span></li>
      <li><kbd>1 / 2 / 3</kbd><span>Weapons</span></li>
      <li><kbd>Esc</kbd><span>Pause</span></li>
    </ul>
    <div class="overlay-hint">Click anywhere to lock the mouse</div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
